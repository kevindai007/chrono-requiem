<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>时之勇者 · 命运织锦</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+SC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div class="wrap">
  <header class="mast">
    <h1 class="logo"><span class="knot" data-svg="KNOT"></span><b>时之勇者</b><span>CHRONO REQUIEM</span></h1>
    <span class="vine" aria-hidden="true"></span>
    <div class="meta">
      <span><b id="floorNo">第 1 层</b></span>
      <span>第 <b id="turnNo">1</b> 回合</span>
      <span>金线 <b id="goldNo">0</b></span>
      <span id="knotsNo" hidden></span>
      <button class="tbtn" id="rulesBtn"><span data-svg="GEAR"></span>规则</button>
      <button class="tbtn" id="resetBtn"><span data-svg="REDO"></span>重开</button>
    </div>
  </header>
  <div class="trim"></div>

  <section class="arena" id="arena" aria-label="战斗">
    <div class="half hero">
      <div class="art" id="heroArt"></div>
      <div class="floats" id="heroFloats"></div>
      <div class="plate">
        <div class="status" id="heroStatus"></div>
        <div class="lr"><span class="nm" id="heroName">勇者</span><span class="hp" id="hpTxt"></span><span class="res" id="heroRes"></span><span class="gauge"><i class="lag" id="hpLag"></i><i class="cur" id="hpBar"></i></span></div>
      </div>
    </div>
    <div class="half foe" id="foeHalf">
      <div class="art" id="enemyArt"></div>
      <div class="floats" id="enemyFloats"></div>
      <div class="plate">
        <div class="status" id="enemyStatus"></div>
        <div class="lr"><span class="nm" id="foeName">黑铁骑士</span><span class="hp" id="ehpTxt"></span><span class="gauge"><i class="lag" id="ehpLag"></i><i class="cur" id="ehpBar"></i></span></div>
      </div>
    </div>
    <div class="roundel" aria-hidden="true" data-svg="ROUNDEL"></div>
    <div class="flash" id="flash"></div>
    <div class="banner" id="banner"><b></b><span></span></div>
  </section>
  <div class="trim"></div>

  <section class="loom">
    <div class="loomhead">
      <span class="ttl"><b>命运织机</b><small>LOOM OF FATE</small></span>
      <div class="hint" id="hint"></div>
      <span class="sprigs" aria-hidden="true"></span>
    </div>
    <div class="tlscroll" id="tlscroll"><div class="tlwrap" id="tlwrap"><div class="tl" id="timeline"></div><div id="needle" aria-hidden="true"></div><svg id="threads" aria-hidden="true"></svg></div></div>
  </section>
  <div class="trim"></div>

  <section class="dock" id="dock">
    <div class="sand">
      <span data-svg="GLASS"></span>
      <div class="sandnum" id="sandNum">3</div>
      <div class="sandlbl">时之砂</div>
      <div class="debt" id="debt"></div>
    </div>
    <div class="hand" id="hand"></div>
    <div class="endwrap">
      <button class="endbtn" id="endBtn"><span data-svg="SHUTTLE"></span><b>推进时间</b></button>
      <div class="pilecount" id="piles"></div>
    </div>
  </section>

  <details class="chron" id="chron">
    <summary><span class="lbl"><span data-svg="FLEUR"></span>战斗记录</span><span class="latest" id="latest"></span><span class="tog">›</span></summary>
    <div class="log" id="log" aria-live="polite"></div>
  </details>
</div>

<div class="scr" id="scr" hidden role="dialog"><div class="scr-in" id="scrIn"></div></div>

<div class="pickscr" id="pick" hidden role="dialog" aria-label="选择职业">
  <div class="pk-in">
    <header class="mast"><div class="logo"><span class="knot" data-svg="KNOT"></span><b>时之勇者</b><span>CHRONO REQUIEM</span></div><h2>选择你的命运</h2></header>
    <div class="trim"></div>
    <div class="pk-field" id="pkRows"></div>
    <div class="pk-foot pp">
      <div class="pitch"><span class="crest" id="pkCrest"></span><span class="who" id="pkWho"></span><p id="pkPitch"></p></div>
      <div class="btns"><button class="btn" id="pkBack">返回</button><button class="btn go" id="pkGo">确认职业</button></div>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/DrawSVGPlugin.min.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/board.js"></script>
<script src="js/screens.js"></script>
<script src="js/motion.js"></script>
</body>
</html>
