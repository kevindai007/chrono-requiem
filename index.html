<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>时之勇者 · 钟楼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+SC:wght@500;700;900&display=swap">
<style>
/* Seven floors of the clock tower: five minor foes, the clockwork knight, then the Demon King at zero hour. The run opens on a class pick (warrior, assassin or mage); the six minor foes are ordinary beasts and soldiers, each built to press one class. Non-knight foes reuse the knight art with a per-foe tint until they get their own. Layout follows kevin's battle mockup: gold title bar; a framed split arena (hero art left, knight art right, VS medallion on the seam); the time ribbon grid; a dock with the sand medallion, illustrated parchment cards and the big 推进时间 plate; one-line chronicle at the foot. Single deliberate dark look. */
:root{
  --night:#08070c; --panel:#0f0d15; --panel2:#171320; --cell:#120f19; --line:#2c2535; --line2:#4a3d4f;
  --gold:#d4a54a; --gold2:#f7dc96; --gold3:#fff1c8; --golddim:#80632a;
  --parch:#f1e6c8; --parch2:#dccaa0; --ink:#2a1d10; --ink2:#5f4a31;
  --azure:#5aa8ff; --azure2:#9fd0ff; --blood:#d8432f; --moss:#7ec26e;
  --text:#efe5d2; --muted:#a39580;
  --t-move:#4d8fe6; --t-res:#e0a43a; --t-rhy:#4caf68; --t-grd:#a8a6bd; --t-frb:#9a5ad8; --t-war:#d0532f; --t-rog:#3fb59a; --t-mag:#6f86ff; --rage:#ff6a3d; --fire:#ff7a3a; --ice:#7fd4ff; --bolt:#e8d24a;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-latin:"Cinzel","Times New Roman",serif;
  --f-body:"Noto Serif SC","Songti SC",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow-x:hidden;
  background-image:radial-gradient(ellipse 30% 40% at 0% 85%,rgba(255,170,70,.16),transparent 70%),radial-gradient(ellipse 30% 40% at 100% 85%,rgba(255,170,70,.14),transparent 70%),radial-gradient(ellipse 70% 40% at 50% 0%,rgba(70,60,120,.35),transparent 70%);background-attachment:fixed}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* ornate frame used by arena + ribbon */
.frame{position:relative;border:1px solid var(--golddim);box-shadow:0 0 0 3px #0a080d,0 0 0 4px rgba(212,165,74,.45),0 14px 40px rgba(0,0,0,.6)}
.frame>.cn{position:absolute;width:26px;height:26px;pointer-events:none;z-index:6}
.frame>.cn svg{width:100%;height:100%}
.frame>.cn.tl{left:-8px;top:-8px}.frame>.cn.tr{right:-8px;top:-8px;transform:scaleX(-1)}
.frame>.cn.bl{left:-8px;bottom:-8px;transform:scaleY(-1)}.frame>.cn.br{right:-8px;bottom:-8px;transform:scale(-1)}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1 .zh{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,5vw,42px);letter-spacing:.06em;line-height:1.1;
  background:linear-gradient(180deg,var(--gold3) 0%,var(--gold2) 40%,var(--gold) 75%,#9a7228 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 16px rgba(212,165,74,.3))}
h1 .la{font-family:var(--f-latin);font-size:13px;letter-spacing:.32em;color:var(--gold);font-weight:500}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.meta .rt{color:var(--text);margin-right:6px;font-variant-numeric:tabular-nums}
.meta .rt b{font-family:var(--f-latin);color:var(--gold2)}
button{font-family:var(--f-body);cursor:pointer}
.gbtn{background:linear-gradient(180deg,#1c1724,#0f0c14);border:1px solid var(--golddim);color:var(--gold2);padding:7px 18px;font-size:14px;letter-spacing:.15em;transition:border-color .15s,box-shadow .15s}
.gbtn:hover,.gbtn:focus-visible{border-color:var(--gold2);box-shadow:0 0 12px rgba(212,165,74,.4);outline:none}
.gbtn.ic{padding:6px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.gbtn.ic svg{width:22px;height:22px}

/* Arena */
.arena{display:grid;grid-template-columns:1fr 1fr;height:340px;background:#0b0910;overflow:hidden}
.half{position:relative;overflow:hidden;min-width:0}
.half .art{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;transition:transform .18s ease-out}
.half.hero .art{background-image:var(--hero,url(img/hero.jpg));background-size:auto 100%;background-position:25% 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);transform-origin:30% 50%}
.half.hero::before{content:"";position:absolute;inset:-20px;background:var(--hero,url(img/hero.jpg)) 25% 0/cover no-repeat;filter:blur(14px) brightness(.55) saturate(1.1)}
.half.foe .art{background-image:url(img/knight.jpg);background-position:55% 25%}
.half.hero .art.lunge{transform:translateX(18px) scale(1.04)}
.half.foe .art.lunge{transform:translateX(-18px) scale(1.04)}
.half::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,7,12,0) 30%,rgba(8,7,12,.55) 62%,rgba(8,7,12,.95) 100%)}
.half.foe.rage .art{filter:saturate(1.4) hue-rotate(-12deg) brightness(1.05)}
.half.foe.rage::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,rgba(216,67,47,.28),transparent 70%);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.4}}
.half .art.hitfx{animation:hitfx .32s}
@keyframes hitfx{0%{filter:brightness(2.6) saturate(.2)}100%{filter:none}}
.half .art.shake{animation:shake .35s,hitfx .32s}
@keyframes shake{25%{translate:-8px 0}50%{translate:7px 0}75%{translate:-3px 0}}
.plate{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 20px 16px;text-align:center}
.name{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.08em;color:var(--gold3);text-shadow:0 2px 0 #000,0 0 14px rgba(0,0,0,.9);line-height:1.2}
.sub{font-size:13px;color:#e4d8c2;text-shadow:0 1px 3px #000;margin-top:-4px}
.bar{width:min(290px,92%);height:18px;background:#09070b;border:1px solid #6a5226;position:relative;overflow:hidden;box-shadow:0 0 0 1px #000,inset 0 2px 4px rgba(0,0,0,.8)}
.bar i{position:absolute;inset:0 auto 0 0}
.bar .lag{background:#fff0cc;opacity:.5;transition:width .7s .35s ease-in}
.bar .cur{background:linear-gradient(180deg,#f06650,#c8321f 55%,#7a1b10);transition:width .25s ease-out}
.half.foe .bar .cur{background:linear-gradient(180deg,#ffe08a,#d4a54a 55%,#7a5a1c)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-latin);font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;z-index:1;font-variant-numeric:tabular-nums}
.status{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:#e4d8c2;min-height:26px;flex-wrap:wrap;text-shadow:0 1px 2px #000}
.gears{display:flex;gap:4px}
.gears i{width:15px;height:15px;border-radius:50%;border:2px solid var(--golddim);background:rgba(0,0,0,.5)}
.gears i.on{border-color:var(--gold2);background:radial-gradient(circle,var(--gold2),var(--gold));box-shadow:0 0 8px var(--gold)}
.tag{border:1px solid var(--golddim);padding:1px 10px;font-size:12px;background:rgba(10,8,12,.75);color:var(--gold2)}
.tag.ok{border-color:var(--moss);color:var(--moss)}
.tag.p2{border-color:var(--blood);color:#ffab9b;animation:pulse 1.4s infinite}
.mood{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);background-size:cover;background-position:center;box-shadow:0 0 8px rgba(0,0,0,.8)}
.mood.judge{border-color:#ff8a4a;box-shadow:0 0 10px #ff8a4a}
.mood.rage{border-color:var(--blood);box-shadow:0 0 12px var(--blood)}
.seam{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);z-index:4;pointer-events:none;background:linear-gradient(180deg,transparent,var(--gold) 15%,var(--gold2) 50%,var(--gold) 85%,transparent)}
.vs{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:5;width:118px;height:118px;pointer-events:none}
.vs svg{width:100%;height:100%;overflow:visible}
.vs .ring{transform-origin:60px 60px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.floats{position:absolute;inset:0;pointer-events:none;z-index:6}
.flt{position:absolute;left:50%;top:34%;transform:translateX(-50%);font-family:var(--f-latin);font-weight:900;font-size:34px;white-space:nowrap;animation:rise 1.3s ease-out forwards;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.9)}
.flt.dmg{color:var(--gold2)} .flt.big{font-size:52px;color:var(--gold3);text-shadow:0 0 22px var(--gold),0 2px 0 #000}
.flt.hurt{color:#ff7a62} .flt.info{font-family:var(--f-display);font-size:19px;color:var(--azure2);letter-spacing:.1em} .flt.heal{color:var(--moss)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,14px) scale(.6)}14%{opacity:1;transform:translate(-50%,0) scale(1.2)}28%{transform:translate(-50%,-6px) scale(1)}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
.flash{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(circle,rgba(255,240,200,.6),transparent 65%);opacity:0}
.flash.on{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.banner{position:absolute;left:0;right:0;top:40%;transform:translateY(-50%);z-index:8;pointer-events:none;text-align:center;opacity:0;padding:12px 0;
  background:linear-gradient(90deg,transparent,rgba(8,7,12,.92) 22%,rgba(8,7,12,.92) 78%,transparent);border-block:1px solid transparent;border-image:linear-gradient(90deg,transparent,var(--gold),transparent) 1}
.banner b{display:block;font-family:var(--f-display);font-weight:900;font-size:32px;letter-spacing:.3em;color:var(--gold2);text-shadow:0 0 18px rgba(212,165,74,.6)}
.banner span{font-family:var(--f-latin);font-size:12px;letter-spacing:.4em;color:var(--muted)}
.banner.red b{color:#ff9a86;text-shadow:0 0 18px rgba(216,67,47,.8)}
.banner.show{animation:banner 1.6s ease-out}
@keyframes banner{0%{opacity:0;letter-spacing:.6em}15%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* Time ribbon */
.ribbon{background:linear-gradient(180deg,var(--panel2),var(--panel));padding:10px 12px 12px}
.tlhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:0 4px 8px}
.label{display:flex;align-items:center;gap:10px;font-family:var(--f-latin);font-size:16px;letter-spacing:.12em;color:var(--gold2)}
.label svg{width:20px;height:24px}
.label small{font-family:var(--f-display);font-size:15px;letter-spacing:.05em}
.hint{font-size:13px;color:var(--azure2);display:flex;align-items:center;gap:6px;min-height:26px}
.hint>svg{width:16px;height:16px;flex:none}
.hint.err{color:#ffb4a5}
.hint.pend{color:var(--gold2)}
.tlscroll{overflow-x:auto;border:1px solid var(--line2);background:var(--cell)}
.tl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(100px,1fr);min-width:max-content;width:100%}
.lanes{display:grid;grid-template-rows:32px 66px 60px 66px;border-right:1px solid var(--line2);background:#0c0a11;position:sticky;left:0;z-index:2;width:128px}
.lanes div{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:14px;color:var(--text);border-bottom:1px solid var(--line)}
.lanes div:last-child{border-bottom:0}
.lanes svg{width:26px;height:26px;color:var(--muted)}
.slot{display:grid;grid-template-rows:32px 66px 60px 66px;border-right:1px solid var(--line);position:relative;transition:background .25s;
  background-image:radial-gradient(circle at 50% 55%,rgba(255,255,255,.025) 0 22px,transparent 23px)}
.slot:last-child{border-right:0}
.slot>div{border-bottom:1px solid var(--line)}
.slot>div:last-child{border-bottom:0}
.slot.now{background-color:rgba(90,168,255,.10)}
.slot.now::before{content:"";position:absolute;inset:0;pointer-events:none;border-left:1px solid rgba(90,168,255,.55);border-right:1px solid rgba(90,168,255,.55);box-shadow:inset 0 0 26px rgba(90,168,255,.14)}
.slot.far{opacity:.5}
.slot.hit{background-color:rgba(212,165,74,.22)}
.slot.hit::before{border:2px solid var(--gold2);box-shadow:inset 0 0 26px rgba(247,220,150,.45),0 0 18px rgba(247,220,150,.4)}
.slot.tgt{cursor:pointer}
.slot.tgt::after{content:"";position:absolute;inset:4px;border:1px dashed var(--gold2);pointer-events:none;opacity:.55}
.slot.tgt:hover{background-color:rgba(247,220,150,.14)}
.bn{display:flex;align-items:center;justify-content:center;font-family:var(--f-latin);font-weight:700;font-size:15px;color:var(--muted)}
.slot.now .bn{color:var(--azure2);text-shadow:0 0 8px rgba(90,168,255,.6)}
.slot.hit .bn{color:var(--gold3)}
.lane{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;padding:4px}
.mid{display:flex;align-items:center;justify-content:center;font-size:13px;text-align:center;padding:0 3px;line-height:1.3}
.mid.ok{color:var(--moss)} .mid.bad{color:#ff9585} .mid.res{color:var(--gold2)} .mid.arm{color:#cfc4b2}
.chip{display:flex;align-items:center;gap:6px;padding:4px 12px;font-size:16px;font-family:var(--f-display);font-weight:700;border:1px solid;min-width:74px;justify-content:center;transition:transform .12s,box-shadow .12s}
.chip b{font-family:var(--f-latin);font-weight:700;font-variant-numeric:tabular-nums}
.chip.h{border-color:var(--gold);color:var(--gold3);background:linear-gradient(180deg,#2a2112,#16110a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 0 8px rgba(212,165,74,.25)}
.chip.h.ch{background:linear-gradient(180deg,#5a4318,#2a1f0c);box-shadow:0 0 12px rgba(247,220,150,.55)}
.chip.e{border-color:var(--blood);color:#ffd6cc;background:linear-gradient(180deg,#5a1a12,#2a0c08);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 0 10px rgba(216,67,47,.45)}
.chip.e.j{border-color:#ff8a4a;background:linear-gradient(180deg,#7a2a10,#3a1206);color:#fff0d8}
.chip.e.j.warn{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 16px var(--blood)}}
.chip.g{border-color:var(--t-grd);color:#dcdaf0;border-style:dashed;background:rgba(168,166,189,.08);font-size:14px}
.chip .lock{font-size:11px;opacity:.85;border-left:1px solid currentColor;padding-left:5px}
.chip.pick{cursor:pointer;outline:2px solid var(--azure2);outline-offset:2px;animation:bob 1s ease-in-out infinite}
.chip.pick:hover{transform:scale(1.07)}
@keyframes bob{50%{translate:0 -2px}}

/* Dock */
.dock{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.sand{position:relative;width:150px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.sand>svg{position:absolute;inset:0;width:100%;height:100%}
.sand .orbit{transform-origin:75px 75px;animation:spin 30s linear infinite}
.sandnum{position:relative;font-family:var(--f-latin);font-weight:900;font-size:46px;line-height:1;color:var(--gold3);text-shadow:0 0 14px rgba(212,165,74,.7),0 2px 0 #000;font-variant-numeric:tabular-nums}
.sandnum.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.3)}}
.grains{position:relative;display:flex;gap:4px;margin:6px 0 4px;min-height:16px;flex-wrap:wrap;justify-content:center;max-width:90px}
.grains i{width:15px;height:15px;transform:rotate(45deg);background:linear-gradient(135deg,var(--gold3),var(--gold) 50%,#8a6524);box-shadow:0 0 8px rgba(247,220,150,.7)}
.sandlbl{position:relative;font-size:14px;color:var(--text);letter-spacing:.15em}
.debt{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:12px;color:#ff9585}
.hand{display:flex;gap:10px;overflow-x:auto;padding:16px 12px 10px;min-width:0}
.hand>.card:first-child{margin-left:auto}.hand>.card:last-child{margin-right:auto}
.hand.empty::before{content:"手牌已放回牌库，时间正在流动……";color:var(--muted);font-size:14px;align-self:center;padding:90px 0}
.card{--tc:var(--t-move);flex:0 0 140px;height:252px;padding:0;border:none;background:none;position:relative;text-align:center;color:var(--ink);transition:transform .18s ease-out,filter .18s}
.card .fr{position:absolute;inset:0;display:flex;flex-direction:column;border:2px solid #b8913f;background:linear-gradient(175deg,var(--parch),var(--parch2));overflow:hidden;
  box-shadow:0 0 0 1px #3a2a10,inset 0 0 0 3px rgba(255,240,200,.35),inset 0 0 0 4px rgba(120,90,40,.5),0 10px 22px rgba(0,0,0,.6),inset 0 0 28px rgba(140,100,40,.3)}
.card .art{height:104px;flex:none;position:relative;overflow:hidden;border-bottom:2px solid #b8913f;background:#111}
.card .art i{position:absolute;inset:-4px;background-size:cover;background-position:center}
.card[data-t="挪移"]{--tc:var(--t-move)} .card[data-t="共鸣"]{--tc:var(--t-res)} .card[data-t="节奏"]{--tc:var(--t-rhy)} .card[data-t="守御"]{--tc:var(--t-grd)} .card[data-t="禁术"]{--tc:var(--t-frb)}
.card[data-t="挪移"] .art i{background-image:url(img/art_move.jpg)}
.card[data-t="共鸣"] .art i{background-image:url(img/art_res.jpg)}
.card[data-t="节奏"] .art i{background-image:url(img/art_rhy.jpg)}
.card[data-t="禁术"] .art i{background-image:url(img/art_frb.jpg)}
.card[data-t="守御"] .art i{background-image:url(img/art_move.jpg);filter:grayscale(1) brightness(1.25) contrast(1.1)}
.card[data-t="战士"]{--tc:var(--t-war)} .card[data-t="刺客"]{--tc:var(--t-rog)} .card[data-t="法师"]{--tc:var(--t-mag)}
.card[data-t="法师"] .art i{background-image:url(img/art_rhy.jpg);filter:hue-rotate(150deg) saturate(1.4) brightness(.95)}
.card[data-t="战士"] .art i{background-image:url(img/art_res.jpg);filter:hue-rotate(-28deg) saturate(1.6) contrast(1.15)}
.card[data-t="刺客"] .art i{background-image:url(img/art_frb.jpg);filter:hue-rotate(-120deg) saturate(1.2) brightness(.9)}
.card.rg .cost::before{background:radial-gradient(circle at 35% 30%,#ffb08a,var(--rage) 45%,#7a1e08)}
.card .cost small{position:absolute;bottom:-11px;left:0;right:0;font-size:10px;color:#ffd0b8;text-shadow:0 1px 2px #000;letter-spacing:0}
.card .cost{position:absolute;top:-10px;left:-10px;width:40px;height:40px;z-index:3;display:flex;align-items:center;justify-content:center}
.card .cost::before{content:"";position:absolute;inset:5px;transform:rotate(45deg);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--tc) 55%,#fff),var(--tc) 45%,color-mix(in srgb,var(--tc) 45%,#000));border:2px solid #e6c472;box-shadow:0 0 0 1px #2a1d0a,0 0 10px var(--tc),0 3px 6px rgba(0,0,0,.6)}
.card .cost span{position:relative;font-family:var(--f-latin);font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.7)}
.card .cn{font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.1em;margin-top:6px;line-height:1.25}
.card .ct{font-size:11px;letter-spacing:.3em;color:var(--ink2);margin-bottom:4px}
.card .cd{font-size:12px;line-height:1.5;padding:0 10px;color:var(--ink);text-align:left}
.card .cx{font-size:11px;color:#a02414;letter-spacing:.06em;margin-top:2px;font-weight:700}
.card .orn{margin-top:auto;padding-bottom:6px;display:flex;justify-content:center}

/* Chronicle */

.chron .latest{font-size:14px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.log{padding:0 4px 8px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px;max-height:180px;overflow:auto}

.panel{max-width:760px;width:100%;max-height:100%;overflow:auto;display:grid;grid-template-columns:200px 1fr;background:linear-gradient(175deg,var(--parch),var(--parch2));color:var(--ink);

.panel button{background:radial-gradient(ellipse at 50% 0%,#5a4116,#1e1508);color:var(--gold3);border:2px solid var(--gold);padding:11px 30px;font-family:var(--f-display);font-weight:900;letter-spacing:.24em;font-size:16px;box-shadow:0 4px 10px rgba(0,0,0,.35)}

.panel .floors{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}

.panel .floors button{padding:3px 10px;font-size:13px;letter-spacing:.06em;font-weight:700;box-shadow:none;background:rgba(42,29,16,.06);color:var(--ink);border:1px solid #b8913f}

.chip.h.rev{border-color:var(--t-frb);color:#ecdcff;background:linear-gradient(180deg,#3d1d5e,#1c0c2c);box-shadow:0 0 12px rgba(154,90,216,.7)}

/* Loom of fate: the timeline in three layers (past stone, present blue threads, future runes) */
.wrap{max-width:1400px}
.loom{display:grid;grid-template-columns:minmax(0,1fr)}
.loom>*{min-width:0}
.loomhead{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:0 4px 8px}
.loomhead .ttl{display:flex;align-items:center;gap:10px}
.loomhead .ttl svg{width:26px;height:36px;flex:none}
.loomhead .ttl b{display:block;font-family:var(--f-display);font-weight:900;font-size:27px;letter-spacing:.3em;line-height:1.1;background:linear-gradient(180deg,var(--gold3),var(--gold) 70%,#9a7228);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000)}
.loomhead .ttl small{display:block;font-family:var(--f-latin);font-size:10px;letter-spacing:.34em;color:var(--gold)}
.loomhead .tsub{font-size:13px;color:var(--muted)}
.loomhead .win{margin-left:auto;border:1px solid var(--golddim);padding:3px 12px;font-size:13px;color:var(--gold2);background:rgba(0,0,0,.4);white-space:nowrap}
.loomhead .win b{font-family:var(--f-latin);color:var(--azure2)}
.ribbon .hint{padding:0 4px 8px}
.tlscroll{position:relative;background:#0b0a12;scrollbar-color:var(--line2) transparent}
.tlwrap{position:relative;min-width:max-content}
.tl{display:flex;grid-auto-flow:unset}
.lanes{flex:none;width:112px;grid-template-rows:40px 70px 64px 70px}
.lanes div{flex-direction:column;gap:0;line-height:1.2}
.lanes div span{display:flex;flex-direction:column;align-items:center}
.lanes small{font-size:10px;color:var(--muted);letter-spacing:.05em}
.lanes div svg{margin-bottom:2px}
.slot{flex:1 0 86px;grid-template-rows:40px 70px 64px 70px;background-image:none}
.slot .bn span{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;background:#0e0c15}
.slot.now{background:linear-gradient(180deg,rgba(50,110,210,.26),rgba(30,70,150,.14));background-color:transparent}
.slot.now::before{border-left:1px solid rgba(120,180,255,.5);border-right:1px solid rgba(120,180,255,.5);box-shadow:inset 0 0 30px rgba(90,168,255,.18)}
.slot.now .bn span{border-color:var(--azure2);color:#fff;box-shadow:0 0 10px var(--azure),inset 0 0 8px rgba(90,168,255,.5);background:#14284a}
.slot .lane,.slot .mid{position:relative}
.slot .lane::before,.slot .mid::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;pointer-events:none;z-index:0}
.slot .lane.e::before{background:rgba(216,67,47,.32)}
.slot .mid::before{background:rgba(212,165,74,.26)}
.slot .lane.h::before{background:rgba(90,168,255,.32)}
.slot.now .lane.e::before{height:2px;margin-top:-1px;background:linear-gradient(90deg,#c8442c,#ffb09a 50%,#c8442c);box-shadow:0 0 8px #d8432f}
.slot.now .mid::before{height:2px;margin-top:-1px;background:linear-gradient(90deg,#a87a28,#ffe7a8 50%,#a87a28);box-shadow:0 0 8px rgba(212,165,74,.8)}
.slot.now .lane.h::before{height:2px;margin-top:-1px;background:linear-gradient(90deg,#4d8fe6,#d8eeff 50%,#4d8fe6);box-shadow:0 0 10px #5aa8ff}
.slot.fut .lane::before,.slot.fut .mid::before{background:repeating-linear-gradient(90deg,rgba(150,170,220,.28) 0 6px,transparent 6px 11px)}
.slot.fut .chip{opacity:.62;filter:saturate(.6);border-style:dashed;box-shadow:none;backdrop-filter:blur(1px)}
.slot.fut .bn{opacity:.75}
.slot.fut .mid{opacity:.75}
.slot.far{opacity:.55}
.chip{position:relative;z-index:1}
.mid .mt{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(11,10,18,.88);padding:2px 6px;line-height:1.25}
.mid .mt:empty{display:none}
.mid em{font-style:normal;font-family:var(--f-latin);font-weight:700;font-size:12px}
.mid em.tk{color:#ff8a72}.mid em.dl{color:var(--gold2)}.mid em.hl{color:#c9a0ff}
.mid .old{font-size:10px;color:var(--muted);text-decoration:line-through}
/* past: frozen stone */
.slot.past{flex:0 0 76px;background:repeating-linear-gradient(160deg,#1b1a20 0 9px,#17161b 9px 18px);filter:grayscale(1);opacity:.8}
.slot.past .bn span{border-color:#5a5860;color:#9d9aa4;background:#1d1c22;box-shadow:none}
.slot.past .chip{background:#2a2930;border-color:#6a6870;border-style:solid;color:#c3c0c8;box-shadow:none;min-width:0;padding:2px 6px;font-size:13px}
.slot.past .lane::before,.slot.past .mid::before{background:#55535b;height:1px;box-shadow:none}
.slot.past .mid .mt{background:#1d1c22}
.slot.past.fresh{animation:petrify .9s ease-out}
@keyframes petrify{0%{filter:grayscale(0) brightness(1.8);opacity:1}100%{filter:grayscale(1);opacity:.8}}
.slot.hit .chip{animation:lit .5s ease-out}
@keyframes lit{0%{filter:brightness(2.4);transform:scale(1.15)}100%{filter:none}}
/* drag preview */
#needle{position:absolute;top:0;bottom:0;left:0;width:4px;margin-left:-2px;z-index:5;pointer-events:none;opacity:0;transition:left .45s cubic-bezier(.5,0,.3,1),opacity .3s;
  background:linear-gradient(180deg,#fff,#bfe2ff 30%,#5aa8ff 75%,rgba(90,168,255,0));box-shadow:0 0 12px #5aa8ff,0 0 28px rgba(90,168,255,.7)}
#needle.on{opacity:1}
#needle::before{content:"";position:absolute;top:3px;left:50%;width:14px;height:14px;transform:translate(-50%,0) rotate(45deg);background:#fff;box-shadow:0 0 12px #9fd0ff,0 0 24px #5aa8ff}
.card{user-select:none;-webkit-user-select:none;touch-action:manipulation}
.card .art b.ic{position:absolute;left:50%;top:50%;width:66px;height:58px;transform:translate(-50%,-50%);background-size:cover;background-position:center;border:2px solid #e6c472;box-shadow:0 0 0 1px #2a1d0a,0 0 14px var(--tc),0 4px 8px rgba(0,0,0,.6)}

.pk-logo b{display:block;font-family:var(--f-display);font-weight:900;font-size:40px;letter-spacing:.06em;line-height:1.1;background:linear-gradient(180deg,var(--gold3),var(--gold2) 40%,var(--gold) 75%,#9a7228);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000)}

.pk-lore{font-size:12px;color:var(--muted);line-height:1.7;margin:8px 0 0}

  if(es.length&&S.smoke.includes(b)){const h=Math.floor(et/2);flt('hero',`烟幕 −${et-h}`,'info');log(`第 ${roman(b)} 拍：烟幕里${F.lane}的${names}只打出一半（${et}→${h}）。`);et=h;if(et<=0)es=[]}

    clean=false;

    if(g&&!ghostOK)log(`第 ${roman(b)} 拍：残影挡不住${names}。`);
    if(ghostOK){
      flt('hero','残影 · 落空','info');log(`第 ${roman(b)} 拍：${F.lane}击中了残影。`);clean=hs.length>0;

    }else if(hs.length){

        dealEnemy(ht,resLbl,{res,src:'atk',beat:b});
        const nx=foeE(e=>!e.locked&&!e.na&&e.beat>b).sort((x,y)=>x.beat-y.beat)[0];
        const st=F.stagger||1;

        const left=et-ht;log(`第 ${roman(b)} 拍：拼刀 ${ht} 对 ${et}，被压制，承受 ${left} 点伤害。`);
        flt('hero','拼刀失利','info');if(left>0)dealHero(left,es);

    }
  }else if(hs.length){hit()}
  for(const c of at(b,'c')){if(S.over)break;castFire(c,b)}

  S.events=S.events.filter(e=>e.beat!==b);
}

function freeze(why){const nx=foeE(e=>!e.locked&&!e.na&&e.beat>cur()).sort((x,y)=>x.beat-y.beat)[0];if(nx){nx.beat++;log(`${why}：${FL().lane}的${nx.label}延后到第 ${roman(nx.beat)} 拍。`);delayed('card')}}
function castFire(c,b){
  flt('hero',c.n,'info');
  for(let i=0;i<c.hits&&!S.over;i++)dealEnemy(c.dmg,c.n,{src:'spell',beat:b});
  if(S.over)return;
  if(c.frz)freeze(c.n);
  const p=S.lastSpell,R=p&&p.el!==c.el&&b-p.beat<=1?REACT[p.el+c.el]:null;
  S.lastSpell={beat:b,el:c.el};
  if(R){banner(R.n,`${p.el} + ${c.el}`);dealEnemy(R.dmg,`元素反应·${R.n}`,{src:'spell',beat:b});S.resThis=true;if(R.frz&&!S.over)freeze(R.n)}
}

// what the timeline showed for a beat just before it resolved, kept as a stone fragment of the past
function snapBeat(b){
  return {b,e:at(b,'e').map(e=>({l:e.label,d:e.dmg,na:e.na})).concat(at(b,'g').map(()=>({l:'残影',na:1})),at(b,'w').map(()=>({l:'盾',na:1})),at(b,'d').map(()=>({l:'闪身',na:1}))),
    h:at(b,'h').map(e=>({l:e.fx?'斩':'击',d:e.dmg})).concat(at(b,'c').map(c=>({l:c.n,na:1})))};
}
async function endTurn(){
  if(S.busy||S.over)return;
  const F=FL();
  S.busy=true;S.pending=null;
  S.discard.push(...S.hand);S.hand=[];
  for(let k=0;k<3;k++){
    const b=S.beat+k;S.resolving=b;render();
    await sleep(520);
    const snap=snapBeat(b);snap.rec=stepBeat(b);
    S.hist.forEach(h=>h.fresh=false);snap.fresh=true;S.hist.push(snap);
    render();
    await sleep(650);
    if(S.over)break;
  }
  S.resolving=null;
  if(!S.over){
    F.turnEnd?.call(F);
    S.beat+=3;S.turn++;gen(S.beat+11);
    S.hist=S.hist.filter(h=>h.b>=S.beat-3);S.hist.forEach(h=>h.fresh=false);
    S.parriedPrev=S.parried;S.parried=false;
    S.dmgLast=S.dmgThis;S.dmgThis=0;S.foresight=false;
    S.lastPlayed=S.played;S.played=null;S.resThis=false;S.cry=false;S.smoke=[];
    S.sand=(CL().sand||3)-S.debt+(S.med?2:0);S.debt=0;S.med=false;S.barrier=0;S.iceArmor=false;
    F.turnStart?.call(F,false);
    S.sand=Math.max(0,S.sand);
    draw(S.drawN);S.drawN=5;
    banner(`第 ${S.turn} 回合`,`HORA ${roman(S.beat)}`);
  }
  S.busy=false;render();
  if(S.over)setTimeout(showEnd,700);
}

/* what a resolved (or simulated) beat came to, in a word or two */
const TAGS=[[/^打断/,'吟唱打断','bad'],[/^屏障/,'屏障护住','ok'],[/^弹反/,'弹反','ok'],[/^闪身/,'闪身','ok'],[/^残影/,'残影','ok'],[/^镜影/,'镜影吞没','bad'],[/^盾反/,'盾反','bad'],[/^拼刀失利/,'拼刀失利','bad'],[/^格挡/,null,'ok'],[/^烟幕/,null,'ok'],[/^冰甲/,'冰甲','ok'],[/^共鸣/,null,'res'],[/^背刺/,null,'res']];
function tagOf(r){
  for(const [re,w,c] of TAGS){const f=r.fx.find(x=>x.who!=='b'&&re.test(x.text));if(f)return {t:w||f.text,c}}
  const re=r.fx.find(x=>x.who==='b');if(re)return {t:re.text,c:'res'};
  const sp=r.fx.find(x=>x.who==='hero'&&SPELLS.has(x.text));if(sp)return {t:'释放·'+sp.text,c:'res'};
  const ar=r.fx.find(x=>x.who==='enemy'&&x.cls==='info'&&/甲|图腾|帷幕/.test(x.text));if(ar)return {t:ar.text.split(' ')[0],c:'arm'};
  return null;
}
const nums=r=>(r.took>0?`<em class="tk">受 ${r.took}</em>`:'')+(r.net>0?`<em class="dl">打 ${r.net}</em>`:'')+(r.net<0?`<em class="hl">回 ${-r.net}</em>`:'');
function midRec(r,bs){
  if(!r)return {h:'',c:''};
  const t=tagOf(r);const n=nums(r);
  let h=(t?`<span>${t.t}</span>`:'')+(n?`<span>${n}</span>`:'');
  const chg=bs&&(bs.took!==r.took||bs.net!==r.net);
  if(chg){const o=(bs.took?`受 ${bs.took}`:'')+(bs.took&&bs.net?' · ':'')+(bs.net>0?`打 ${bs.net}`:bs.net<0?`回 ${-bs.net}`:'');h+=`<span class="old">${o||'无事'}</span>`}
  if(!h&&r.es.length)h='<span>无伤</span>';
  return {h,c:r.took>0?'bad':t?t.c:r.net>0?'res':'',chg};
}
const lanesHtml=F=>`<div class="lanes"><div>拍</div><div>${LANE.foe}<span>${F.lane}<small>敌方行动</small></span></div><div>${LANE.clash}<span>交锋<small>冲突判定</small></span></div><div>${LANE.hero}<span>勇者<small>我方行动</small></span></div></div>`;
function pastSlot(h){
  const m=midRec(h.rec);
  return `<div class="slot past ${h.fresh?'fresh':''}" data-pb="${h.b}"><div class="bn"><span>${roman(h.b)}</span></div>
    <div class="lane e">${h.e.map(x=>`<div class="chip st">${x.l}${x.na?'':` <b>${x.d}</b>`}</div>`).join('')}</div>
    <div class="mid"><span class="mt">${m.h}</span></div>
    <div class="lane h">${h.h.map(x=>`<div class="chip st">${x.l}${x.na?'':` <b>${x.d}</b>`}</div>`).join('')}</div></div>`;
}
// the analytic guess for beats past this turn: what the board looks like if nothing else changes
function guessMid(b,F){
  const hs=at(b,'h'),ae=at(b,'e'),es=atkE(b),gs=at(b,'g'),ms=at(b,'m'),ws=at(b,'w'),ds=at(b,'d'),cs=at(b,'c'),cw=S.events.filter(e=>e.side==='c'&&e.from<=b&&e.beat>b);
  let mid='',mc='';const ht=heroTotal(hs);let et=es.reduce((a,e)=>a+e.dmg,0);
  const ghostOK=gs.length&&!es.some(e=>e.noGhost);
  const blk=es.length&&ws.length&&!ghostOK&&!ds.length?Math.min(8,et):0;et-=blk;
  const armor=v=>{if(!F.mod)return v;return F.mod(v,{res:hs.length>=2,src:'atk',beat:b})};
  const shown=v=>{const a=armor(v);return a<v?`${F.modShort}→${a}`:a};
  if(ms.length&&hs.length){mid='镜影<br>攻击落空';mc='bad'}
  else if(es.length&&ds.length){mid=hs.length?`闪身<br>${shown(ht)}`:'闪身';mc='ok'}
  else if(es.length&&ghostOK){mid='落空·反击';mc='ok'}
  else if(es.length&&blk&&et<=0){mid=hs.length?`格挡 ${blk}<br>打 ${shown(ht)}`:`格挡 ${blk}`;mc='ok'}
  else if(es.length&&hs.length){const pre=blk?`挡${blk} `:'';if(ht>et){mid=`${pre}拼刀${ht}>${et}<br>弹反`;mc='ok'}else{mid=`${pre}拼刀${ht}≤${et}<br>受 ${et-ht}`;mc='bad'}}
  else if(es.length&&blk){mid=`格挡 ${blk}<br>受 ${et}`;mc='bad'}
  else if(hs.length>=2){mid=`共鸣×${mult(hs.length)}<br>${shown(ht)}`;mc='res'}
  else if(hs.length===1&&hs[0].rev){mid=`逆针<br>魔王回 ${ht}`;mc='bad'}
  else if(hs.length&&ae.some(e=>e.sh)){mid=`盾反<br>弹回 ${Math.floor(ht/2)}`;mc='bad'}
  else if(hs.length&&S.run.cls==='rogue'){mid=`背刺<br>${shown(ht)}`;mc=armor(ht)<ht?'arm':'res'}
  else if(hs.length&&F.mod){const v=armor(ht);if(v<ht){mid=`${F.modShort}→${v}`;mc='arm'}}
  const hurts=es.length&&!ds.length&&!ghostOK&&et>0&&!(hs.length&&ht>et);
  if((cs.length||cw.length)&&hurts){mid=S.barrier?'屏障<br>护住吟唱':'打断<br>吟唱！';mc=S.barrier?'ok':'bad'}
  else if(cs.length&&!mid){mid=`释放<br>${cs.map(e=>e.el).join('')}`;mc='res'}
  return {h:mid,c:mc};
}
function liveSlot(b,o){
  const F=FL(),pend=o.pend;
  const hs=at(b,'h'),ae=at(b,'e'),gs=at(b,'g'),ms=at(b,'m'),ws=at(b,'w'),ds=at(b,'d'),ks=at(b,'k'),cs=at(b,'c'),cw=S.events.filter(e=>e.side==='c'&&e.from<=b&&e.beat>b);
  const now=b<S.beat+3,far=b>=S.beat+baseView();

  const ech=ae.map(e=>{const warn=e.kind==='j'&&b-S.beat<3;return `<div class="chip e ${e.kind==='j'?'j':''} ${e.na?(e.sh?'sh':'na'):''} ${e.fin?'fin':''} ${warn?'warn':''} ${tg==='e'&&!e.locked?'pick':''} " data-id="${e.id}">${e.label}${e.na?'':` <b>${e.dmg}</b>`}${e.locked?'<span class="lock">锁</span>':''}</div>`}).join('')
    +gs.map(()=>`<div class="chip g">残影</div>`).join('')+ws.map(()=>`<div class="chip w">盾 −8</div>`).join('')+ds.map(()=>`<div class="chip d">闪身</div>`).join('')+ms.map(()=>`<div class="chip e mir">镜影</div>`).join('');
  const hch=hs.map(e=>`<div class="chip h ${e.ch?'ch':''} ${e.fx?'fx':''} ${e.rev?'rev':''} ${tg==='h'?'pick':''}" data-id="${e.id}">${e.rev?'逆':e.fx?'斩':'击'} <b>${e.dmg}</b></div>`).join('')

  const m=now?midRec(o.rec):guessMid(b,F);
  return `<div class="slot ${now?'now':'fut'} ${far?'far':''} ${S.smoke.includes(b)?'smk':''} ${S.resolving===b?'hit':''} ${tgt?'tgt':''} " data-b="${b}">
    <div class="bn"><span>${roman(b)}</span></div><div class="lane e">${ech}</div><div class="mid ${m.c}"><span class="mt">${m.h}</span></div><div class="lane h">${hch}</div></div>`;
}
let scrollKey='';

function pic(F,hero){
  if(hero)return `<div class="pic hero" style="background-image:url(img/body_${S.run.cls}.jpg);background-position:center 8%"></div>`;
  return `<div class="pic" style="${F.portrait?'':`background-image:url(img/knight.jpg);background-position:${F.art.pos};`}filter:${F.art.filter}"></div>`;
}
function openPanel(html,focus){$('panel').innerHTML=html;$('modal').hidden=false;const f=$(focus);if(f)f.focus()}
function closePanel(){$('modal').hidden=true}
function floorPicker(){
  return `<div class="floors"><span>楼层（试玩可直接跳层，从头开始的生命和牌组）</span>${FLOORS.map((f,i)=>`<button data-fl="${i}" class="${i===S.stage?'cur':''}">${f.floor} · ${f.name}</button>`).join('')}</div>`;
}
function wireFloors(){document.querySelectorAll('.floors button').forEach(b=>b.onclick=()=>{newRun(+b.dataset.fl,S.run.cls);render();showRules(true)})}
const PICK={warrior:{col:'#9a2414',la:'WARRIOR',q:'以剑守护当下，\n以时间开创未来。'},rogue:{col:'#1d6a5c',la:'ASSASSIN',q:'以影为步，\n以时间为刃。'},mage:{col:'#26408f',la:'MAGE',q:'以时间为语，\n以星轨为笔。'}};
const COMPASS='<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="40" cy="40" r="25"/><circle cx="40" cy="40" r="31" stroke-dasharray="2 3"/><path d="M40 2l5 33 33 5-33 5-5 33-5-33-33-5 33-5z" fill="currentColor" fill-opacity=".18"/><path d="M40 18l3 19 19 3-19 3-3 19-3-19-19-3 19-3z" fill="currentColor" fill-opacity=".5"/><path d="M22 22l12 12M58 22L46 34M22 58l12-12M58 58L46 46"/><circle cx="40" cy="40" r="3" fill="currentColor"/></svg>';
const PI={hp:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>',
  sand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/></svg>',
  atk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l12 12M20 4L8 16M14 18l4-4M6 14l4 4M3 21l3-3M21 21l-3-3"/></svg>'};
const ART_T={'战士':'img/art_res.jpg','刺客':'img/art_frb.jpg','法师':'img/art_rhy.jpg'};
let pickSel='warrior';
function pkRow(k){
  const C=CLASSES[k],P=PICK[k],cards=[...new Set(C.deck)];
  return `<button class="pk-row" data-cl="${k}" style="--cc:${P.col}" aria-pressed="false">
    <span class="pk-por"><span class="fig" style="background-image:url(img/hero_${k}.jpg)"></span><span class="em">${COMPASS}${P.la}</span></span>
    <span class="pk-inf"><h3>${COMPASS}${C.n} · ${C.title}<small>${P.la}</small></h3>
      <span class="pk-st"><span>${PI.hp}生命 ${C.hp}</span><span>${PI.sand}每回合 ${C.sand||3} 粒时之砂</span><span>${PI.atk}每${C.atk.every===1?'':` ${C.atk.every} `}拍自动攻击 ${C.atk.dmg} 点</span></span>
      <p class="pk-pitch">${C.pitch}</p>
      <span class="pk-cards"><b>职业牌</b>${cards.map(x=>`<figure><i style="background-image:url(${ICONS.has(x)?`img/ic_${x}.jpg`:ART_T[C.n]})"></i>${CARDS[x].n}</figure>`).join('')}</span></span>
    <span class="pk-badge">当前选择</span></button>`;
}
function updatePick(){
  document.querySelectorAll('.pk-row').forEach(r=>{const on=r.dataset.cl===pickSel;r.classList.toggle('on',on);r.setAttribute('aria-pressed',on)});
  const b=$('pkBody');b.classList.add('swap');
  setTimeout(()=>{b.style.backgroundImage=`url(img/body_${pickSel}.jpg)`;b.setAttribute('aria-label',`${CLASSES[pickSel].n}的角色形象`);b.classList.remove('swap')},120);
  $('pkQuote').textContent=PICK[pickSel].q;
  $('pkGo').style.setProperty('--cc',PICK[pickSel].col);$('pkGo').textContent=`确认职业 · ${CLASSES[pickSel].n} ›`;
}
function showClassPick(first){
  closePanel();
  pickSel=(first!==true&&S&&S.run&&S.run.cls)||'warrior';
  $('pkRows').innerHTML=Object.keys(CLASSES).map(pkRow).join('');
  document.querySelectorAll('.pk-row').forEach(r=>{r.onclick=()=>{pickSel=r.dataset.cl;updatePick()};r.ondblclick=()=>$('pkGo').click()});
  $('pkBack').hidden=first===true;
  $('pick').hidden=false;$('pick').scrollTop=0;updatePick();
  const f=document.querySelector('.pk-row.on');if(f)f.focus({preventScroll:true});
}
$('pkGo').onclick=()=>{$('pick').hidden=true;newRun(0,pickSel);render();showRules(true)};
$('pkBack').onclick=()=>{$('pick').hidden=true;if(S.over)showEnd()};
function showRules(intro){
  const F=FL();
  openPanel(`${pic(F)}<div class="body"><h2>${F.name}</h2><p class="psub">${F.floor} · ${F.lore}　（你是${CL().n}）</p>
  <ul>${F.rules.map(r=>`<li>${r}</li>`).join('')}</ul>
  ${intro?`<ul><li><b>${CL().n}</b>：${CL().rule}</li></ul>`:`<ul>
    <li>时间轴上排着未来的行动：上方是敌人，下方是你。每回合 <b>3 粒时之砂</b>，点「推进时间」结算亮色的 3 拍。</li>
    <li><b>${CL().n}</b>：${CL().rule}</li>
    <li><b>共鸣</b>：多次攻击落在同一拍，总伤害 ×1.5（三次及以上 ×2）。<b>拼刀</b>：和敌人同拍且伤害更高就弹反，敌人攻击作废并硬直。</li>
    <li>高塔七层：${FLOORS.map(f=>f.name).join(' → ')}。每层打完回满生命，最大生命 +5，并挑一张新牌。</li>
  </ul>`}
  ${floorPicker()}
  <div class="btns"><button id="startBtn">${S.turn===1&&!S.busy?'开战':'继续'}</button><button class="alt" id="pickBtn">换职业重来</button></div></div>`,'startBtn');
  wireFloors();$('pickBtn').onclick=()=>showClassPick();
  $('startBtn').onclick=()=>{closePanel();if(S.turn===1&&!S.busy)banner(F.floor,F.name)};
}
function showEnd(){
  if(!$('modal').hidden&&$('panel').dataset.end===String(S.uid))return;
  const F=FL(),win=S.over==='win',last=S.stage===FLOORS.length-1;
  const stats=`<div class="stats"><div><span>回合</span><b>${S.turn}</b></div><div><span>剩余生命</span><b>${S.hp}/${S.maxhp}</b></div><div><span>${F.lane}剩余</span><b>${S.ehp}/${S.emax}</b></div></div>`;
  if(!win){
    openPanel(`${pic(F)}<div class="body"><h2>时间终结</h2><p class="psub">你倒在了${F.floor}，${F.name}面前。也许，该换一种方式排布时间。</p>${stats}
    <div class="btns"><button id="retryBtn">重试本层</button><button class="alt" id="runBtn">重新选职业</button></div></div>`,'retryBtn');
    $('retryBtn').onclick=()=>{closePanel();startFight(S.run);render();banner(FL().floor,FL().name)};
    $('runBtn').onclick=()=>showClassPick();
  }else if(last){
    openPanel(`${pic(F,true)}<div class="body"><h2>永夜终结</h2><p class="psub">第 ${S.turn} 回合，魔王的钟针停下了。这一次，时间站在你这边。</p>${stats}
    <div class="btns"><button id="runBtn">再登钟楼</button></div></div>`,'runBtn');
    $('runBtn').onclick=()=>showClassPick();
  }else{
    const N=FLOORS[S.stage+1];
    // two class cards and one shared time card
    const pool=shuffle(CL().pool.slice()).slice(0,2).concat(shuffle(F.reward.slice()).slice(0,1));
    openPanel(`${pic(F,true)}<div class="body"><h2>${F.name}倒下了</h2><p class="psub">第 ${S.turn} 回合，你击败了${F.name}。往上一层（${N.floor}）是${N.name}。最大生命 +5，并回满。</p>${stats}
    <p class="psub" style="border:0;margin-bottom:8px">挑一张牌加入牌组：</p>
    <div class="rewards">${pool.map(k=>{const C=CARDS[k];return `<button class="rw" data-t="${C.t}" data-k="${k}"><b>${C.n}</b><i>${C.t} · ${C.c} 沙${C.x?' · 消耗':''}</i><br>${C.d}</button>`}).join('')}</div>
    <div class="btns"><button class="alt" id="skipBtn">不拿牌，直接上楼</button></div></div>`);
    const next=k=>{const run=S.run;if(k)run.deck.push(k);run.maxhp+=5;run.stage++;startFight(run);render();showRules(true)};
    document.querySelectorAll('.rw').forEach(b=>b.onclick=()=>next(b.dataset.k));
    $('skipBtn').onclick=()=>next(null);
    const f=document.querySelector('.rw');if(f)f.focus();
  }
  $('panel').dataset.end=String(S.uid);
}

// embers
(function(){
  const cv=$('dust'),ctx=cv.getContext('2d');let w,h,ps=[];
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){const d=Math.min(devicePixelRatio||1,2);w=cv.width=innerWidth*d;h=cv.height=innerHeight*d;ps=Array.from({length:Math.round(innerWidth/20)},()=>({x:Math.random()*w,y:Math.random()*h,r:(Math.random()*1.5+.4)*d,v:(Math.random()*.3+.08)*d,a:Math.random()*.5+.15,p:Math.random()*6.28}))}
  function tick(){ctx.clearRect(0,0,w,h);for(const p of ps){p.y-=p.v;p.p+=.01;p.x+=Math.sin(p.p)*.2;if(p.y<-4){p.y=h+4;p.x=Math.random()*w}ctx.globalAlpha=p.a*(.6+.4*Math.sin(p.p*3));ctx.fillStyle='#ffd88a';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill()}if(!still)requestAnimationFrame(tick)}
  addEventListener('resize',size);size();tick();
})();

function start(data){
  if(data&&data.state&&data.state.run&&data.state.run.cls&&data.state.hp!=null){S=data.state;S.busy=false;S.resolving=null;S.pending=null;S.hist??=[];S.doneUpTo??=S.beat-1;if(S.doneUpTo>=S.beat)S.doneUpTo=S.beat-1;render();if(S.over)showEnd()}
  else{newRun(0,'warrior');render();showClassPick(true)}
}
window.claude?.hot?.snapshot?.(()=>({state:JSON.parse(JSON.stringify(S))}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

</body></html>
